<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacroScanner | AI Power</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="icon">🥗</span>
                <h1>MacroScanner</h1>
            </div>
            <div class="meal-summary-header" id="headerSummary">
                <div class="summary-item">
                    <span class="label">Calories</span>
                    <span class="value" id="totalCalories">0</span>
                </div>
                <div class="summary-item">
                    <span class="label">Protein</span>
                    <span class="value" id="totalProtein">0g</span>
                </div>
            </div>
        </header>

        <main>
            <div id="debug-log" style="color: #ef4444; font-size: 0.7rem; padding: 10px; display: none; background: rgba(0,0,0,0.5); border-radius: 8px; margin-bottom: 10px;"></div>

            <section class="search-bar-container">
                <input type="text" id="top-search" placeholder="Type product name here...">
                <button id="top-search-btn" class="icon-btn">🔍</button>
            </section>

            <section id="scanner-section" class="active">
                <div class="main-actions">
                    <label for="snap-input" class="action-card">
                        <span class="action-icon">📸</span>
                        <div class="action-text">
                            <h3>Snap Barcode</h3>
                            <p>Uses your iPhone's real camera for 100% focus</p>
                        </div>
                    </label>
                    <input type="file" id="snap-input" accept="image/*" capture="environment" style="display:none">

                    <div class="action-row">
                        <button id="manual-search-btn" class="secondary-btn">🔍 Search by Name</button>
                        <button id="manual-barcode-btn" class="secondary-btn">⌨️ Type Barcode</button>
                    </div>
                </div>

                <div class="scanner-wrapper mini">
                    <div id="reader"></div>
                    <button id="start-live-btn" class="text-btn">Or use Live Video Scanner (Experimental)</button>
                </div>
            </section>

            <section id="product-details" class="hidden">
                <div class="card glass">
                    <div class="card-header">
                        <button id="close-details" class="icon-btn">✕</button>
                        <h2 id="productName">Product Name</h2>
                    </div>
                    <div class="product-info">
                        <div class="macro-grid">
                            <div class="macro-item">
                                <input type="number" class="macro-input" id="prodCal" value="0">
                                <span class="macro-label">kcal</span>
                            </div>
                            <div class="macro-item">
                                <input type="number" class="macro-input" id="prodProtein" value="0" step="0.1">
                                <span class="macro-label">Protein</span>
                            </div>
                            <div class="macro-item">
                                <input type="number" class="macro-input" id="prodCarbs" value="0" step="0.1">
                                <span class="macro-label">Carbs</span>
                            </div>
                            <div class="macro-item">
                                <input type="number" class="macro-input" id="prodFat" value="0" step="0.1">
                                <span class="macro-label">Fat</span>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="prodWeight">Weight (g)</label>
                            <input type="number" id="prodWeight" value="100" min="1">
                        </div>
                        <button id="add-to-meal" class="primary-btn">Add to Meal</button>
                    </div>
                </div>
            </section>

            <section id="meal-builder">
                <div class="section-header">
                    <h2>Your Meal</h2>
                    <button id="clear-meal" class="text-btn">Clear</button>
                </div>
                <div id="meal-list" class="meal-list">
                    <div class="empty-state">Scan something!</div>
                </div>
            </section>
        </main>

        <footer>
            <div class="bottom-nav">
                <button class="nav-item active" id="navScan">📷 Scan</button>
                <button class="nav-item" id="navMeal">🍽️ Meal</button>
            </div>
        </footer>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script src="app.js"></script>
</body>
</html>
