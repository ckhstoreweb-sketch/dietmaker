<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacroScanner | Scan & Build Meals</title>
    <meta name="description" content="A premium barcode scanner for tracking nutrition and building custom meals.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="icon">🥗</span>
                <h1>MacroScanner</h1>
            </div>
            <div class="meal-summary-header" id="headerSummary">
                <div class="summary-item">
                    <span class="label">Calories</span>
                    <span class="value" id="totalCalories">0</span>
                </div>
                <div class="summary-item">
                    <span class="label">Protein</span>
                    <span class="value" id="totalProtein">0g</span>
                </div>
            </div>
        </header>

        <main>
            <section class="search-bar-container">
                <input type="text" id="top-search" placeholder="Can't scan? Type product name here...">
                <button id="top-search-btn" class="icon-btn">🔍</button>
            </section>

            <section id="scanner-section" class="active">
                <div class="scanner-wrapper">
                    <div id="reader"></div>
                </div>
                <div class="scanner-controls">
                    <button id="manual-btn" class="secondary-btn">Barcode</button>
                    <button id="camera-btn" class="secondary-btn">Next Lens</button>
                    <button id="torch-btn" class="secondary-btn">Flash</button>
                    <label for="file-input" class="secondary-btn">Upload Photo</label>
                    <input type="file" id="file-input" accept="image/*" style="display:none">
                </div>
                <p class="scan-tip">Tip: Hold barcode 6 inches away and keep still</p>
            </section>

            <section id="product-details" class="hidden">
                <div class="card glass">
                    <div class="card-header">
                        <button id="close-details" class="icon-btn">✕</button>
                        <h2 id="productName">Product Name</h2>
                    </div>
                    <div class="product-info">
                        <p class="edit-hint">Tap values to edit if incorrect</p>
                        <div class="macro-grid">
                            <div class="macro-item">
                                <input type="number" class="macro-input" id="prodCal" value="0">
                                <span class="macro-label">kcal</span>
                            </div>
                            <div class="macro-item">
                                <input type="number" class="macro-input" id="prodProtein" value="0" step="0.1">
                                <span class="macro-label">Protein</span>
                            </div>
                            <div class="macro-item">
                                <input type="number" class="macro-input" id="prodCarbs" value="0" step="0.1">
                                <span class="macro-label">Carbs</span>
                            </div>
                            <div class="macro-item">
                                <input type="number" class="macro-input" id="prodFat" value="0" step="0.1">
                                <span class="macro-label">Fat</span>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="prodWeight">Amount (grams/ml)</label>
                            <input type="number" id="prodWeight" value="100" min="1">
                        </div>
                        <button id="add-to-meal" class="primary-btn">Add to Meal</button>
                    </div>
                </div>
            </section>

            <section id="meal-builder">
                <div class="section-header">
                    <h2>Your Meal</h2>
                    <button id="clear-meal" class="text-btn">Clear All</button>
                </div>
                <div id="meal-list" class="meal-list">
                    <!-- Items will be added here -->
                    <div class="empty-state">
                        <p>No items added yet. Scan a product to start!</p>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <div class="bottom-nav">
                <button class="nav-item active" id="navScan">
                    <span class="nav-icon">📷</span>
                    <span>Scan</span>
                </button>
                <button class="nav-item" id="navMeal">
                    <span class="nav-icon">🍽️</span>
                    <span>Meal</span>
                </button>
            </div>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
