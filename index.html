<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacroScanner | Pro Entry</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="icon">📊</span>
                <h1>MacroScanner</h1>
            </div>
            <div class="meal-summary-header">
                <div class="summary-item">
                    <span class="label">Total Calories</span>
                    <span class="value" id="totalCalories">0</span>
                </div>
                <div class="summary-item">
                    <span class="label">Protein</span>
                    <span class="value" id="totalProtein">0g</span>
                </div>
            </div>
        </header>

        <main>
            <!-- Quick Add Section -->
            <section class="quick-add card glass">
                <h3>Quick Add by Barcode</h3>
                <div class="input-row">
                    <input type="number" id="barcode-input" placeholder="Type barcode number here...">
                    <button id="add-barcode-btn" class="primary-btn">Find</button>
                </div>
                <div class="input-row" style="margin-top: 10px;">
                    <input type="text" id="name-input" placeholder="Or search by name...">
                    <button id="search-name-btn" class="secondary-btn">Search</button>
                </div>
            </section>

            <!-- Inventory / History Section -->
            <section class="inventory-section">
                <div class="section-header">
                    <h3>Your Inventory</h3>
                    <p class="hint">Tap an item to add to your meal</p>
                </div>
                <div id="inventory-list" class="inventory-grid">
                    <!-- History items will appear here -->
                    <p class="empty-state">No saved products yet.</p>
                </div>
            </section>

            <!-- Current Meal Section -->
            <section class="meal-section">
                <div class="section-header">
                    <h3>Current Meal</h3>
                    <button id="clear-meal" class="text-btn">Clear All</button>
                </div>
                <div id="meal-list" class="meal-list">
                    <div class="empty-state">Add items from your inventory or search above.</div>
                </div>
            </section>

            <!-- Product Entry / Edit Modal (Hidden by default) -->
            <section id="product-modal" class="modal hidden">
                <div class="modal-content glass">
                    <div class="modal-header">
                        <h2 id="modalProductName">Product Name</h2>
                        <button id="close-modal" class="icon-btn">✕</button>
                    </div>
                    <div class="modal-body">
                        <div class="macro-grid">
                            <div class="macro-item">
                                <label>kcal / 100g</label>
                                <input type="number" id="prodCal" value="0">
                            </div>
                            <div class="macro-item">
                                <label>Protein / 100g</label>
                                <input type="number" id="prodProtein" value="0" step="0.1">
                            </div>
                            <div class="macro-item">
                                <label>Carbs / 100g</label>
                                <input type="number" id="prodCarbs" value="0" step="0.1">
                            </div>
                            <div class="macro-item">
                                <label>Fat / 100g</label>
                                <input type="number" id="prodFat" value="0" step="0.1">
                            </div>
                        </div>
                        <div class="weight-input">
                            <label>Amount to add (grams)</label>
                            <input type="number" id="prodWeight" value="100">
                        </div>
                        <button id="confirm-add" class="primary-btn">Add to Meal</button>
                    </div>
                </div>
            </section>
        </main>

        <div id="toast" class="toast hidden"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
